<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMR Risk Surveillance & Crop Advisory System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.95);
        }
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .input-group-text {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px 0 0 10px;
        }
        .section-title {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 30px;
        }
        .map-container {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <!-- Header -->
        <div class="text-center mb-5">
            <h1 class="display-4 text-white mb-3">
                <i class="fas fa-seedling me-3"></i>
                AMR Risk Surveillance & Multi-Factor Crop Advisory System
            </h1>
            <p class="lead text-white-50">
                Advanced AI-powered agricultural decision support system for sustainable farming
            </p>
        </div>

        <!-- Main Form -->
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-body p-5">
                        <h2 class="section-title text-center">
                            <i class="fas fa-search me-2"></i>
                            Agricultural Risk Assessment
                        </h2>

                        <form id="assessmentForm" action="/analyze" method="POST">
                            <!-- Location Section -->
                            <div class="mb-4">
                                <h5 class="mb-3">
                                    <i class="fas fa-map-marker-alt text-primary me-2"></i>
                                    Location Information
                                </h5>
                                <div class="row">
                                    <div class="col-md-8">
                                        <div class="input-group mb-3">
                                            <span class="input-group-text">
                                                <i class="fas fa-city"></i>
                                            </span>
                                            <input type="text" class="form-control" id="location" name="location"
                                                   placeholder="Enter Village/City name or PIN Code" required>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <button type="button" class="btn btn-outline-primary w-100" onclick="getLocation()">
                                            <i class="fas fa-crosshairs me-2"></i>
                                            Use GPS
                                        </button>
                                    </div>
                                </div>

                                <!-- Map Placeholder -->
                                <div class="map-container mb-3">
                                    <iframe
                                        width="100%"
                                        height="200"
                                        frameborder="0"
                                        style="border:0"
                                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3888.8!2d77.5946!3d12.9716!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTLCsDU4JzE3LjciTiA3N8KwMzUnNDAuNiJF!5e0!3m2!1sen!2sin!4v1634567890123!5m2!1sen!2sin"
                                        allowfullscreen>
                                    </iframe>
                                </div>
                            </div>

                            <!-- Agricultural Parameters -->
                            <div class="mb-4">
                                <h5 class="mb-3">
                                    <i class="fas fa-flask text-success me-2"></i>
                                    Soil & Agricultural Parameters
                                </h5>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="input-group mb-3">
                                            <span class="input-group-text">
                                                <i class="fas fa-tractor"></i>
                                            </span>
                                            <input type="number" class="form-control" id="manure_usage" name="manure_usage"
                                                   placeholder="Manure Usage (0-50 Tons/Acre)" min="0" max="50" step="0.1" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="input-group mb-3">
                                            <span class="input-group-text">
                                                <i class="fas fa-spray-can"></i>
                                            </span>
                                            <input type="number" class="form-control" id="pesticide_freq" name="pesticide_freq"
                                                   placeholder="Pesticide Frequency (0-12/month)" min="0" max="12" step="0.1" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="input-group mb-3">
                                            <span class="input-group-text">
                                                <i class="fas fa-horse"></i>
                                            </span>
                                            <input type="number" class="form-control" id="animal_density" name="animal_density"
                                                   placeholder="Animal Density (0-600 count)" min="0" max="600" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="input-group mb-3">
                                            <span class="input-group-text">
                                                <i class="fas fa-vial"></i>
                                            </span>
                                            <input type="number" class="form-control" id="soil_ph" name="soil_ph"
                                                   placeholder="Soil pH (4.0-9.0)" min="4.0" max="9.0" step="0.1" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="input-group mb-3">
                                            <span class="input-group-text">
                                                <i class="fas fa-tint"></i>
                                            </span>
                                            <input type="number" class="form-control" id="soil_moisture" name="soil_moisture"
                                                   placeholder="Soil Moisture (10-90%)" min="10" max="90" step="0.1" required>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-search me-2"></i>
                                    Analyze & Get Recommendations
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    document.getElementById('location').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                }, function(error) {
                    alert('Error getting location: ' + error.message);
                });
            } else {
                alert('Geolocation is not supported by this browser.');
            }
        }

        // Form validation
        document.getElementById('assessmentForm').addEventListener('submit', function(e) {
            const inputs = this.querySelectorAll('input[required]');
            let isValid = true;

            inputs.forEach(input => {
                if (!input.value) {
                    input.classList.add('is-invalid');
                    isValid = false;
                } else {
                    input.classList.remove('is-invalid');
                }
            });

            if (!isValid) {
                e.preventDefault();
                alert('Please fill in all required fields.');
            }
        });
    </script>
</body>
</html>
